<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Lifecycle: Cloudflare source audit, fix, deploy, then web-audit tests the running site and loops back to fixes">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <!-- boxes -->
  <g stroke="#9CA3AF" stroke-width="1.5">
    <rect x="12"  y="40" width="210" height="72" rx="10" fill="#FFF3E6"/>
    <rect x="286" y="40" width="160" height="72" rx="10" fill="#F3F4F6"/>
    <rect x="510" y="40" width="130" height="72" rx="10" fill="#EAF7EE"/>
    <rect x="704" y="40" width="210" height="72" rx="10" fill="#E8F0FE"/>
  </g>
  <g fill="#1F2937" text-anchor="middle">
    <text x="117" y="70" font-size="15" font-weight="700">Cloudflare security-audit</text>
    <text x="117" y="92" font-size="13" fill="#4B5563">reads source code</text>
    <text x="366" y="80" font-size="15" font-weight="700">Fix vulnerabilities</text>
    <text x="575" y="80" font-size="15" font-weight="700">Deploy</text>
    <text x="809" y="70" font-size="15" font-weight="700">web-audit</text>
    <text x="809" y="92" font-size="13" fill="#4B5563">tests the running site</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M222,76 L284,76"/>
    <path d="M446,76 L508,76"/>
    <path d="M640,76 L702,76"/>
  </g>
  <!-- feedback arrow from web-audit back to Fix -->
  <path d="M809,112 L809,170 Q809,182 797,182 L378,182 Q366,182 366,170 L366,114"
        stroke="#2563EB" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="587" y="205" font-size="12.5" fill="#2563EB" text-anchor="middle">confirms reachable + verifies the deployment</text>
</svg>
