<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="web-audit phases: scope gate, recon, unauthenticated checks, authenticated checks, verification, report">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <g stroke="#9CA3AF" stroke-width="1.5" text-anchor="middle">
    <rect x="150" y="12"  width="260" height="60" rx="10" fill="#FEF2F2"/>
    <rect x="150" y="100" width="260" height="68" rx="10" fill="#E8F0FE"/>
    <rect x="150" y="196" width="260" height="68" rx="10" fill="#E8F0FE"/>
    <rect x="150" y="292" width="260" height="68" rx="10" fill="#E8F0FE"/>
    <rect x="150" y="388" width="260" height="60" rx="10" fill="#EAF7EE"/>
    <rect x="150" y="476" width="260" height="60" rx="10" fill="#F3F4F6"/>
  </g>
  <g fill="#1F2937" text-anchor="middle">
    <text x="280" y="38"  font-size="15" font-weight="700">0 · Scope gate</text>
    <text x="280" y="58"  font-size="12" fill="#4B5563">authorisation + rules of engagement</text>

    <text x="280" y="128" font-size="15" font-weight="700">1 · Recon</text>
    <text x="280" y="148" font-size="12" fill="#4B5563">crawl · JS mining · browser · HAR</text>

    <text x="280" y="224" font-size="15" font-weight="700">2 · Unauthenticated checks</text>
    <text x="280" y="244" font-size="12" fill="#4B5563">headers · TLS · exposed files · params</text>

    <text x="280" y="320" font-size="15" font-weight="700">3 · Authenticated checks</text>
    <text x="280" y="340" font-size="12" fill="#4B5563">IDOR · access control · JWT</text>

    <text x="280" y="414" font-size="15" font-weight="700">4 · Verification</text>
    <text x="280" y="434" font-size="12" fill="#4B5563">re-test each finding from scratch</text>

    <text x="280" y="502" font-size="15" font-weight="700">5 · Report</text>
    <text x="280" y="522" font-size="12" fill="#4B5563">findings.json + report.md</text>
  </g>
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#a2)">
    <path d="M280,72  L280,98"/>
    <path d="M280,168 L280,194"/>
    <path d="M280,264 L280,290"/>
    <path d="M280,360 L280,386"/>
    <path d="M280,448 L280,474"/>
  </g>
  <!-- verification rejects loop back up -->
  <path d="M150,418 Q70,418 70,330 Q70,230 140,230" stroke="#9CA3AF" stroke-width="1.5"
        fill="none" stroke-dasharray="4,4" marker-end="url(#a2)"/>
  <text x="60" y="325" font-size="11" fill="#6B7280" text-anchor="middle" transform="rotate(-90 60 325)">rejected → re-test</text>
</svg>
